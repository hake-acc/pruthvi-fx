<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Page Not Found ✲ Pruthvi</title>
  <meta name="description" content="The page you are looking for does not exist. Head back to Pruthvi's portfolio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(140, 160, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 540px;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(48px, 10vw, 84px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background-color: #ffffff;
      color: #000000;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 9999px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.04);
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="badge">404 Error</div>
    <h1>Lost in Space</h1>
    <p>This page doesn’t exist or has been moved. Explore the 3D gallery and selected thumbnail designs on the home page.</p>
    <a href="/" class="btn">Return to Portfolio ✲</a>
  </div>
</body>
</html>
