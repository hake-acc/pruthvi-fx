<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pruthvi Fx | Thumbnail Artist</title>
    <meta name="author" content="Pruthvi Fx" />
    <meta name="theme-color" content="#09080f" />
    <meta
      name="description"
      content="Explore Pruthvi Fx's thumbnail design portfolio featuring Minecraft, Roblox, and IRL thumbnails built to grab attention and earn the click."
    />
    <meta property="og:site_name" content="Pruthvi Fx" />
    <meta property="og:title" content="Pruthvi Fx | Thumbnail Artist" />
    <meta
      property="og:description"
      content="Explore Pruthvi Fx's thumbnail design portfolio featuring Minecraft, Roblox, and IRL thumbnails built to grab attention and earn the click."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PruthviFX" />
    <meta name="twitter:creator" content="@PruthviFX" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="/assets/aistudio/image_58923e46.png" type="image/png" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pruthvifx_cached_site_config_v2');
          if (raw) {
            var cfg = JSON.parse(raw);
            if (cfg && cfg.brandName) {
              document.title = cfg.brandName + ' | Thumbnail Artist';
            }
            if (cfg && cfg.logoSrc) {
              var f = document.querySelector('link[rel="icon"]');
              if (f) f.href = cfg.logoSrc;
            }
            if (cfg && cfg.theme) {
              var t = cfg.theme;
              var r = document.documentElement;
              if (t.primaryColor) {
                r.style.setProperty('--primary', t.primaryColor);
                r.style.setProperty('--ring', t.primaryColor);
              }
              if (t.kickerColor) r.style.setProperty('--kicker', t.kickerColor);
              if (t.navActiveColor) {
                r.style.setProperty('--nav-active', t.navActiveColor);
                r.style.setProperty('--accent', t.navActiveColor);
              }
              if (t.darkBg) {
                r.style.setProperty('--background', t.darkBg);
                document.documentElement.style.background = t.darkBg;
              }
              if (t.darkCard) {
                r.style.setProperty('--card', t.darkCard);
                r.style.setProperty('--popover', t.darkCard);
              }
              var disp = (t.customFont || t.displayFont || '').trim();
              if (disp && !['sans-serif', 'system-ui', 'monospace'].includes(disp.toLowerCase())) {
                r.style.setProperty('--font-display', '"' + disp + '", sans-serif');
                r.style.setProperty('--font-tagline', '"' + disp + '", sans-serif');
                var l = document.createElement('link');
                l.id = 'dynamic-google-fonts';
                l.rel = 'stylesheet';
                l.href =
                  'https://fonts.googleapis.com/css2?family=' +
                  encodeURIComponent(disp.replace(/\+/g, ' ')) +
                  ':wght@400;500;600;700;800&display=swap';
                document.head.appendChild(l);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
